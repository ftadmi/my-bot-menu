<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منوی دانلود فیلم و سریال</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #17212b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
        }
        .view {
            display: none;
            flex-direction: column;
            gap: 12px;
        }
        .active {
            display: flex;
        }
        .menu-btn, .action-btn {
            background-color: #242f3d;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: 500;
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .menu-btn:active, .action-btn:active {
            background-color: #2b5278;
        }
        .btn-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .flag-icon {
            width: 24px;
            height: 16px;
            border-radius: 3px;
            object-fit: cover;
            vertical-align: middle;
        }
        .header-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #5288c1;
        }
        .search-box {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #2b5278;
            background-color: #18222d;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 10px;
        }
        .back-btn {
            background-color: #1e293b;
            color: #83a6cd;
            margin-bottom: 10px;
            padding: 10px 15px;
            font-size: 14px;
            justify-content: center;
        }
        .search-submit-btn {
            background-color: #2b5278;
            justify-content: center;
            margin-top: 5px;
            font-weight: bold;
        }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
    </style>
</head>
<body>

    <!-- صفحه اول: منوی اصلی -->
    <div id="main-view" class="view active">
        <div class="header-title">🎬 منوی دانلود فیلم و سریال</div>

        <button class="menu-btn" onclick="openSearch('iranian', 'ایرانی')">
            <span class="btn-content">
                <img class="flag-icon" src="https://flagcdn.com/w40/ir.png" alt="پرچم ایران">
                جستجوی فیلم و سریال ایرانی
            </span>
            <span>‹</span>
        </button>

        <button class="menu-btn" onclick="openSearch('turkish', 'ترکیه‌ای')">
            <span class="btn-content">
                <img class="flag-icon" src="https://flagcdn.com/w40/tr.png" alt="پرچم ترکیه">
                جستجوی فیلم و سریال ترکیه‌ای
            </span>
            <span>‹</span>
        </button>

        <button class="menu-btn" onclick="openSearch('foreign', 'خارجی')">
            <span class="btn-content">
                <span>🌍</span>
                جستجوی فیلم و سریال خارجی
            </span>
            <span>‹</span>
        </button>

        <button class="menu-btn" onclick="switchView('categories-view')">
            <span class="btn-content">
                <span>📂</span>
                دسته‌بندی‌ها
            </span>
            <span>‹</span>
        </button>

        <button class="menu-btn" onclick="switchView('suggested-type-view')">
            <span class="btn-content">
                <span>💡</span>
                فیلم‌ها و سریال‌های پیشنهادی
            </span>
            <span>‹</span>
        </button>

        <button class="menu-btn" onclick="openBotLink('latest')">
            <span class="btn-content">
                <span>🔥</span>
                جدیدترین فیلم‌ها و تازه‌ها
            </span>
            <span>‹</span>
        </button>

        <button class="menu-btn" onclick="openBotLink('profile')">
            <span class="btn-content">
                <span>👤</span>
                حساب کاربری و اطلاعات
            </span>
            <span>‹</span>
        </button>
    </div>

    <!-- صفحه دوم: فیلد جستجو و نمایش بنر در همین صفحه -->
    <div id="search-view" class="view">
        <button class="action-btn back-btn" onclick="switchView('main-view')">
            <span>🔙 بازگشت به منوی اصلی</span>
        </button>

        <div class="header-title" id="searchTitle">🔍 جستجو</div>
        
        <input type="text" id="movieInput" class="search-box" placeholder="نام فیلم یا سریال را وارد کنید...">
        
        <button class="menu-btn search-submit-btn" onclick="executeInAppSearch()">
            <span>🚀 جستجو، بررسی آرشیو و دریافت بنر</span>
        </button>

        <!-- محلی برای نمایش کارت‌های نتایج (بنر و توضیحات) -->
        <div id="searchResultsContainer" style="margin-top: 15px; display: flex; flex-direction: column; gap: 15px;"></div>
    </div>

    <!-- صفحه دسته‌بندی‌های جدید -->
    <div id="categories-view" class="view">
        <button class="action-btn back-btn" onclick="switchView('main-view')">
            <span>🔙 بازگشت به منوی اصلی</span>
        </button>

        <div class="header-title">📂 انتخاب دسته‌بندی</div>

        <div class="grid-container">
            <button class="menu-btn" onclick="selectCategory('korean')">
                <span class="btn-content">
                    <img class="flag-icon" src="https://flagcdn.com/w40/kr.png" alt="پرچم کره">
                    کره‌ای
                </span>
            </button>
            <button class="menu-btn" onclick="selectCategory('indian')">
                <span class="btn-content">
                    <img class="flag-icon" src="https://flagcdn.com/w40/in.png" alt="پرچم هند">
                    هندی
                </span>
            </button>
            <button class="menu-btn" onclick="selectCategory('popular')"><span>⭐ محبوب‌ها</span></button>
            <button class="menu-btn" onclick="selectCategory('romcom')"><span>❤️😂 عاشقانه-کمدی</span></button>
            <button class="menu-btn" onclick="selectCategory('actcom')"><span>⚡😂 اکشن-کمدی</span></button>
            <button class="menu-btn" onclick="selectCategory('romdrama')"><span>❤️🎭 عاشقانه-درام</span></button>
            <button class="menu-btn" onclick="selectCategory('animation')"><span>🎨 انیمیشن</span></button>
            <button class="menu-btn" onclick="selectCategory('romcom18')"><span>🔞❤️ عاشقانه-کمدی (18+)</span></button>
            <button class="menu-btn" onclick="selectCategory('rom18')"><span>🔞❤️ عاشقانه (18+)</span></button>
        </div>
    </div>

    <!-- صفحه انتخاب نوع پیشنهادی: فیلم یا سریال -->
    <div id="suggested-type-view" class="view">
        <button class="action-btn back-btn" onclick="switchView('main-view')">
            <span>🔙 بازگشت به منوی اصلی</span>
        </button>

        <div class="header-title">💡 انتخاب دسته‌بندی پیشنهادات</div>

        <button class="menu-btn" onclick="selectMediaType('movie')">
            <span>🎥 فیلم‌های پیشنهادی</span>
            <span>‹</span>
        </button>

        <button class="menu-btn" onclick="selectMediaType('series')">
            <span>📺 سریال‌های پیشنهادی</span>
            <span>‹</span>
        </button>
    </div>

    <!-- صفحه انتخاب ژانر -->
    <div id="genre-view" class="view">
        <button class="action-btn back-btn" onclick="switchView('suggested-type-view')">
            <span>🔙 بازگشت به مرحله قبل</span>
        </button>

        <div class="header-title">🎭 ژانر مورد نظرت را انتخاب کن</div>

        <div class="grid-container">
            <button class="menu-btn" onclick="selectGenre('drama')"><span>🎭 درام</span></button>
            <button class="menu-btn" onclick="selectGenre('action')"><span>⚡ اکشن</span></button>
            <button class="menu-btn" onclick="selectGenre('comedy')"><span>😂 کمدی</span></button>
            <button class="menu-btn" onclick="selectGenre('horror')"><span>👻 ترسناک</span></button>
            <button class="menu-btn" onclick="selectGenre('romance')"><span>❤️ عاشقانه</span></button>
            <button class="menu-btn" onclick="selectGenre('mystery')"><span>🕵️ رازآلود</span></button>
            <button class="menu-btn" onclick="selectGenre('animation')"><span>🎨 انیمیشن</span></button>
            <button class="menu-btn" onclick="selectGenre('thriller')"><span>🔥 هیجان انگیز</span></button>
            <button class="menu-btn" onclick="selectGenre('fantasy')"><span>🧚 فانتزی</span></button>
            <button class="menu-btn" onclick="selectGenre('crime')"><span>🔪 جنایی</span></button>
            <button class="menu-btn" onclick="selectGenre('adventure')"><span>🧭 ماجراجویی</span></button>
            <button class="menu-btn" onclick="selectGenre('musical')"><span>🎵 موزیکال</span></button>
            <button class="menu-btn" onclick="selectGenre('western')"><span>🤠 وسترن</span></button>
            <button class="menu-btn" onclick="selectGenre('war')"><span>🪖 جنگی</span></button>
            <button class="menu-btn" onclick="selectGenre('scifi')"><span>🚀 علمی تخیلی</span></button>
            <button class="menu-btn" onclick="selectGenre('family')"><span>👨‍👩‍👧‍👦 خانوادگی</span></button>
            <button class="menu-btn" onclick="selectGenre('biography')"><span>📜 بیوگرافی</span></button>
            <button class="menu-btn" onclick="selectGenre('history')"><span>🏛️ تاریخی</span></button>
            <button class="menu-btn" onclick="selectGenre('sport')"><span>⚽ ورزشی</span></button>
        </div>
    </div>

    <!-- صفحه لیست آثار (پایه) -->
    <div id="results-list-view" class="view">
        <button class="action-btn back-btn" onclick="goBackFromResults()">
            <span>🔙 بازگشت به مرحله قبل</span>
        </button>

        <div class="header-title" id="listTitle">📋 لیست آثار</div>
        
        <div style="text-align: center; color: #8abcff; padding: 20px; font-size: 15px;">
            ⏳ لیست آثار این بخش به زودی پس از تکمیل ربات فعال خواهد شد...
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentSearchCountry = 'foreign';
        let selectedMediaType = 'movie';
        let navigationSource = 'categories';

        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        function openSearch(category, categoryName) {
            currentSearchCountry = category; // iranian, turkish, foreign
            document.getElementById('searchTitle').innerText = `🔍 جستجوی فیلم و سریال ${categoryName}`;
            document.getElementById('movieInput').value = '';
            document.getElementById('searchResultsContainer').innerHTML = '';
            switchView('search-view');
        }

        async function executeInAppSearch() {
            const query = document.getElementById('movieInput').value.trim();
            const container = document.getElementById('searchResultsContainer');
            
            if (!query) {
                alert("لطفاً نام فیلم یا سریال را وارد کنید!");
                return;
            }

            container.innerHTML = '<div style="text-align: center; color: #8abcff; padding: 15px;">⏳ در حال جستجو و دریافت بنر از آرشیو و TMDB...</div>';

            try {
                // اتصال به سرور شما روی پورت ۵۰۰۰
                const response = await fetch(`http://80.253.254.144:5000/api/search_media?q=${encodeURIComponent(query)}&country=${currentSearchCountry}`);
                const result = await response.json();

                container.innerHTML = '';

                if (!result.success || !result.data || result.data.length === 0) {
                    container.innerHTML = '<div style="text-align: center; color: #ff8a8a; padding: 15px;">❌ متأسفانه فیلمی با این مشخصات یافت نشد.</div>';
                    return;
                }

                // ساخت کارت‌های بنر و توضیحات برای هر فیلم
                result.data.forEach(item => {
                    const card = document.createElement('div');
                    card.style.cssText = "background-color: #242f3d; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.3);";

                    let posterHtml = '';
                    if (item.poster_url && item.poster_url !== 'no_poster') {
                        posterHtml = `<img src="${item.poster_url}" alt="Poster" style="width: 100%; max-height: 380px; object-fit: cover; border-radius: 8px;">`;
                    }

                    card.innerHTML = `
                        ${posterHtml}
                        <div style="font-size: 16px; font-weight: bold; color: #5288c1;">${item.title}</div>
                        <div style="font-size: 13px; color: #ccc; white-space: pre-line; line-height: 1.5;">${item.caption}</div>
                        <button onclick="openDownloadBot('${item.title}')" style="background-color: #2b5278; color: white; border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center;">
                            📥 دریافت لینک‌های دانلود در ربات
                        </button>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                container.innerHTML = '<div style="text-align: center; color: #ff8a8a; padding: 15px;">⚠️ خطا در ارتباط با سرور. لطفاً مطمئن شوید web_server.py با pm2 روشن است و پورت ۵۰۰۰ باز است.</div>';
            }
        }

        function openDownloadBot(movieTitle) {
            window.location.href = `https://t.me/MovieDownUploaderBot?start=dl_${encodeURIComponent(movieTitle)}`;
        }

        function selectCategory(cat) {
            navigationSource = 'categories';
            switchView('results-list-view');
        }

        function selectMediaType(type) {
            selectedMediaType = type;
            switchView('genre-view');
        }

        function selectGenre(genre) {
            navigationSource = 'genre';
            switchView('results-list-view');
        }

        function goBackFromResults() {
            if (navigationSource === 'genre') {
                switchView('genre-view');
            } else {
                switchView('categories-view');
            }
        }

        function openBotLink(action) {
            window.location.href = `https://t.me/MovieDownUploaderBot?start=${action}`;
        }
    </script>
</body>
</html>
