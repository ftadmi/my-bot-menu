<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منوی ربات</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #17212b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .menu-btn {
            background-color: #242f3d;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: 500;
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .menu-btn:active {
            background-color: #2b5278;
        }
        .header-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #5288c1;
        }
    </style>
</head>
<body>

    <div class="header-title">🎬 منوی مدیریت و دانلود</div>

    <button class="menu-btn" onclick="openLink('https://t.me/MovieDownUploaderBot?start=search')">
        <span>🔍 جستجوی پیشرفته فیلم/سریال</span>
        <span>‹</span>
    </button>

    <button class="menu-btn" onclick="openLink('https://t.me/MovieDownUploaderBot?start=iranian')">
        <span>🇮🇷 سایت‌های ایرانی (MovieBaz & Uptvs)</span>
        <span>‹</span>
    </button>

    <button class="menu-btn" onclick="openLink('https://t.me/MovieDownUploaderBot?start=latest')">
        <span>🔥 جدیدترین فیلم‌ها و تازه‌ها</span>
        <span>‹</span>
    </button>

    <button class="menu-btn" onclick="openLink('https://t.me/MovieDownUploaderBot?start=profile')">
        <span>👤 پروفایل من و اطلاعات</span>
        <span>‹</span>
    </button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // باز شدن به صورت کامل در پنجره تلگرام

        function openLink(url) {
            // بستن مینی اپ و هدایت به ربات با دستور مربوطه
            window.location.href = url;
        }
    </script>
</body>
</html>
